<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F8F8F6">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://kocslkcomltzfzlttvhx.supabase.co wss://kocslkcomltzfzlttvhx.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>People Support Portal · Earthbar & Beaming</title>
<style>
  /* =====================================================================================
      People Support Portal — design tokens (Earthbar black + white core; semantic status colour)
      UI pass 2026-09-02. Visual layer only: every id/class app.js renders is unchanged.
     ===================================================================================== */
  :root{
    color-scheme:light;
    /* Earthbar core: black, white, and neutral greys. Semantic state colours stay below. */
    --eb-forest:#090909; --eb-green:#D4D4D4; --eb-green-2:#FFFFFF; --eb-mint:#F5F5F5;
    --bm-gold:#F2B84B; --bm-gold-2:#FFD98A;
    /* surfaces */
    --bg:#090909; --bg-2:#111111; --surface:#151515; --surface-2:#1C1C1C; --surface-3:#262626;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    /* text */
    --ink:#F5F5F5; --ink-2:#D4D4D4; --muted:#A3A3A3; --muted-2:#8A8A8A; --on-green:#090909;
    /* semantic (text colour + tinted background, all >= 6:1) */
    --ok:#4ADE80; --warn:#F5A54E; --danger:#FF7B72; --info:#7CB8FF; --teal:#5FD9CB;   /* warn is orange-amber so it never reads as Beaming gold */
    --ok-bg:#12301F; --warn-bg:#33270F; --danger-bg:#3A1A1A; --info-bg:#14273A; --teal-bg:#0F2E2B; --neutral-bg:#262626;
    /* aliases app.js still references inline (var(--green|--grey|--red|--line)) */
    --green:var(--eb-green-2); --green-dk:var(--eb-green); --grey:var(--muted); --red:var(--danger);
    --wash:var(--surface-2); --wash2:var(--surface-3);
    /* shape */
    --radius:12px; --r-sm:8px; --r-lg:16px; --r-xl:22px; --r-pill:999px;
    /* elevation + glow */
    --shadow-1:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.65);
    --shadow-2:0 2px 6px rgba(0,0,0,.4),0 24px 56px -22px rgba(0,0,0,.75);
    --glow:0 0 0 1px rgba(255,255,255,.28),0 10px 30px -10px rgba(255,255,255,.18);
    --focus:0 0 0 3px rgba(255,255,255,.55);
    /* motion */
    --ease:cubic-bezier(.2,.8,.2,1); --t-fast:120ms; --t:200ms;
    /* type */
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:var(--font);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{background:var(--bg);scroll-padding-top:64px}   /* keyboard/Shift+Tab focus scrolls fields out from under the 52px sticky nav */
  /* html paints the ground; body stays transparent so the fixed z-index:-1 backdrop below is actually visible */
  body{margin:0;font-family:var(--font);color:var(--ink);background:transparent;line-height:1.5;font-size:15px;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh}
  /* subtle monochrome backdrop — a fixed layer, never an ancestor of text */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(900px 520px at 6% -12%, rgba(255,255,255,.055), transparent 62%),
      radial-gradient(720px 420px at 102% -4%, rgba(255,255,255,.035), transparent 60%),
      radial-gradient(900px 640px at 50% 112%, rgba(255,255,255,.025), transparent 62%)}
  ::selection{background:rgba(255,255,255,.24)}
  ::-webkit-scrollbar{width:10px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  a{color:var(--ink)}
  b,strong{font-weight:600}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* ---- header ---- */
  header.top{position:relative;display:flex;align-items:center;gap:14px;padding:14px 24px;
    background:rgba(9,9,9,.92);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.6) 35%,rgba(255,255,255,.18) 65%,transparent)}
  header.top .brand{font-family:var(--font-display);font-size:21px;font-weight:800;letter-spacing:-.03em;text-transform:lowercase;line-height:1}
  header.top .brand.eb{color:var(--ink)}
  header.top .brand.bm{font-weight:700;color:var(--ink-2)}
  header.top .rule{width:1px;height:22px;background:var(--line-2)}
  header.top .sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  #userbox{margin-left:auto;display:flex;align-items:center;gap:12px}
  #userbox .ub-name{font-size:12.5px;text-align:right;line-height:1.25;color:var(--ink);font-weight:600;overflow-wrap:anywhere}
  #userbox .ub-title{color:var(--muted);font-weight:500}

  /* ---- nav ---- */
  nav{position:sticky;top:0;z-index:20;display:flex;gap:4px;padding:6px 16px;overflow-x:auto;scrollbar-width:none;
    background:rgba(9,9,9,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  nav::-webkit-scrollbar{display:none}
  nav:empty{display:none}
  nav button{position:relative;border:0;background:transparent;padding:10px 14px;border-radius:var(--r-sm);font:inherit;font-size:12.5px;
    font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;
    transition:color var(--t) var(--ease),background var(--t) var(--ease)}
  nav button:hover{color:var(--ink);background:rgba(255,255,255,.04)}
  nav button.active{color:var(--ink)}
  nav button.active::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,var(--ink),var(--muted));box-shadow:0 0 6px rgba(255,255,255,.25)}

  /* 1180 (was 1040): the 11-column cases table needs the room once refs/pills stop wrapping */
  main{max-width:1180px;margin:0 auto;padding:28px 20px 72px}

  /* ---- cards & type ---- */
  .card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;margin-bottom:18px;
    box-shadow:var(--shadow-1),inset 0 1px 0 rgba(255,255,255,.04)}
  .card:has(> table){overflow-x:auto}
  @supports not selector(:has(a)){.card{overflow-x:auto}}   /* pre-:has() browsers: never let a table push the page sideways */
  h2.section{font-family:var(--font-display);font-size:20px;margin:2px 0 4px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
  .muted{color:var(--muted);font-size:14px}
  .row{display:flex;gap:18px;flex-wrap:wrap}
  .col{flex:1;min-width:240px}
  label{display:block;font-weight:600;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin:18px 0 6px}
  .mini-l{display:block;font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .note-sm{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}

  /* ---- inputs ---- */
  input[type=text],input[type=date],input[type=number],textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:10px;
    font:inherit;font-size:14px;background-color:var(--surface-2);color:var(--ink);
    transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease),background-color var(--t) var(--ease)}
  input:hover,textarea:hover,select:hover{border-color:rgba(255,255,255,.28)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:var(--focus);background-color:var(--surface-3)}
  ::placeholder{color:var(--muted-2);opacity:1}
  textarea{min-height:120px;resize:vertical;line-height:1.55}
  select{appearance:none;-webkit-appearance:none;padding-right:38px;cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23A3A3A3' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 13px center;background-size:14px}
  select option,select optgroup{background:var(--surface-2);color:var(--ink)}
  /* inputs nested in tinted panels sit on the darker ground so they still read as fields */
  .iv-row :is(input,select,textarea):not(:focus),.alleg-wrap :is(input,select):not(:focus),.reassign :is(input,select):not(:focus),.filters :is(input,select):not(:focus),.role-multi{background-color:var(--bg-2)}
  input[type=checkbox]{accent-color:var(--ink)}
  input[type=file]{font-size:13px;color:var(--muted);min-width:0}   /* min-width:0 — the Upload row was the last 320px overflow */
  input[type=file]::file-selector-button{font:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--line-2);
    background:var(--surface-2);color:var(--ink-2);cursor:pointer;margin-right:10px;transition:background var(--t) var(--ease),border-color var(--t) var(--ease)}
  input[type=file]::file-selector-button:hover{background:var(--surface-3);border-color:rgba(255,255,255,.5);color:var(--ink)}

  /* ---- choice cards ---- */
  .radio-cards{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
  .radio-card{flex:1;min-width:220px;border:1px solid var(--line-2);border-radius:14px;padding:16px 18px;cursor:pointer;background:var(--surface-2);
    transition:transform var(--t) var(--ease),border-color var(--t) var(--ease),box-shadow var(--t) var(--ease),background var(--t) var(--ease)}
  .radio-card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.4);box-shadow:var(--shadow-2)}
  .radio-card.sel{border-color:var(--ink);background:var(--surface-3);box-shadow:var(--glow)}
  .radio-card b{display:block;margin-bottom:3px;font-weight:600}
  .radio-card .muted{font-size:12.5px}
  .radio-card.fork{padding:22px;font-size:15px}
  .radio-card.fork b{font-family:var(--font-display);font-size:16px;font-weight:700;margin-bottom:6px}
  .radio-card.fork:hover{border-color:var(--ink);background:var(--surface-3)}

  /* ---- buttons ---- */
  .btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:10px;border:1px solid transparent;
    font:inherit;font-size:13px;font-weight:600;letter-spacing:.01em;cursor:pointer;color:var(--on-green);text-decoration:none;
     background:linear-gradient(135deg,#FFFFFF,#CFCFCF);background-size:150% 150%;background-position:0 0;
     box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 18px -8px rgba(255,255,255,.35);-webkit-tap-highlight-color:transparent;
    transition:transform var(--t-fast) var(--ease),box-shadow var(--t) var(--ease),background-position var(--t) var(--ease),filter var(--t) var(--ease),background-color var(--t) var(--ease),border-color var(--t) var(--ease),color var(--t) var(--ease)}
  .btn:hover{transform:translateY(-1px);background-position:100% 100%;filter:brightness(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 12px 28px -8px rgba(255,255,255,.4)}
  .btn:active{transform:translateY(0) scale(.985);filter:brightness(.97);box-shadow:0 2px 8px -4px rgba(255,255,255,.3)}
  /* keyboard ring = the global :focus-visible outline (a box-shadow ring here would be overridden by .sec/.ghost/.danger) */
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;filter:saturate(.3) brightness(.85);box-shadow:none}
  .btn .spin{border-color:rgba(9,9,9,.25);border-top-color:var(--on-green)}
  .btn.sec{background:rgba(255,255,255,.08);color:var(--ink);border-color:rgba(255,255,255,.35);box-shadow:none}
  .btn.sec:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.65);box-shadow:0 8px 22px -10px rgba(255,255,255,.3)}
  .btn.sec .spin{border-color:rgba(255,255,255,.25);border-top-color:var(--ink)}
  .btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2);box-shadow:none}
  .btn.ghost:hover{background:rgba(255,255,255,.08);color:var(--ink);border-color:rgba(255,255,255,.3);box-shadow:none}
  .btn.danger{background:linear-gradient(135deg,#D23A40,#B0282E);color:#fff;box-shadow:0 6px 18px -8px rgba(210,58,64,.55)}
  .btn.danger:hover{box-shadow:0 12px 28px -8px rgba(210,58,64,.7)}
  .btn.danger.sm{display:flex;margin-top:12px}   /* Close case… is terminal: its own line under the state moves, not one of them */
  .btn.sm{padding:7px 12px;font-size:12px;border-radius:8px}
  .btn.ms{display:inline-flex;align-items:center;gap:10px}

  /* ---- pills, chips, badges ---- */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);font-size:10.5px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;border:1px solid var(--line-2);background:var(--neutral-bg);color:var(--ink-2);white-space:nowrap;line-height:1.5}
  .pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 4px currentColor;flex-shrink:0}
  /* case lifecycle: intake -> active -> waiting -> monitoring -> attention -> done */
  .s-New,.s-Submitted,.s-Triage,.s-Assigned,.s-AwaitingInformation{background:var(--info-bg);color:var(--info);border-color:rgba(124,184,255,.3)}
  .s-UnderReview,.s-Investigation,.s-InInteractiveProcess,.s-Action{background:var(--ok-bg);color:var(--ok);border-color:rgba(74,222,128,.3)}
  .s-DecisionPending,.s-OnHold{background:var(--warn-bg);color:var(--warn);border-color:rgba(245,165,78,.3)}
  .s-ActionMonitoring,.s-Monitoring{background:var(--teal-bg);color:var(--teal);border-color:rgba(95,217,203,.3)}
  .s-Escalated,.s-Reopened{background:var(--danger-bg);color:var(--danger);border-color:rgba(255,123,114,.35)}
  .s-Resolved,.s-Closed{background:var(--surface-3);color:var(--muted);border-color:var(--line)}
  .pill.r-Low,.pill.due-ok,.pill.a-Approved{background:var(--ok-bg);color:var(--ok);border-color:rgba(74,222,128,.3)}
  .pill.r-Medium{background:var(--warn-bg);color:var(--warn);border-color:rgba(245,165,78,.3)}
  /* the one SOLID pill on the board: Overdue / Litigation / Denied must pop past Medium-risk and waiting-state tints */
  .pill.due-over{background:var(--warn);color:#241A05;border-color:transparent;box-shadow:0 4px 12px -6px rgba(245,165,78,.7)}
  .pill.r-High,.pill.a-Denied{background:var(--danger-bg);color:var(--danger);border-color:rgba(255,123,114,.35)}
  .pill.a-Withdrawn{background:var(--surface-3);color:var(--muted);border-color:var(--line)}
  .chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:var(--r-pill);
    background:var(--surface-3);color:var(--ink-2);border:1px solid var(--line);line-height:1.5}
  .chip.soft{background:var(--surface-2);color:var(--muted)}
  .chip a{text-decoration:none}
  .warnbadge{background:var(--warn-bg);color:var(--warn);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;
    border-radius:var(--r-pill);border:1px solid rgba(245,165,78,.35)}

  /* ---- tables ---- */
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 8px;border-bottom:1px solid var(--line-2);font-weight:600;vertical-align:bottom}
  td{padding:13px 8px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2)}
  tbody tr:last-child td{border-bottom:0}
  tr.clk{cursor:pointer}
  tr.clk td{transition:background var(--t-fast) var(--ease)}
  tr.clk:hover td{background:var(--surface-2)}
  tr.clk:hover td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
  /* overdue rows: visible wash + amber left bar (on phones the SLA column is off-screen, so this is the only cue) */
  tr.overdue td{background:rgba(245,165,78,.09)}
  tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  tr.clk.overdue:hover td{background:rgba(245,165,78,.15)}
  .ref{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
  .row-link{appearance:none;border:0;background:transparent;padding:5px 3px;margin:-5px -3px;cursor:pointer;text-align:left}
  .row-link:hover{text-decoration:underline;text-underline-offset:3px}
  .row-link:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}

  /* ---- banners ---- */
  .banner{position:relative;border-radius:12px;padding:13px 16px 13px 19px;margin:8px 0;font-size:14px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);line-height:1.5}
  .banner::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--muted)}
  .banner.ok{background:var(--ok-bg);border-color:rgba(74,222,128,.25);color:#D7F5E1}     .banner.ok::before{background:var(--ok)}
  .banner.warn{background:var(--warn-bg);border-color:rgba(245,165,78,.3);color:#F8E7C4}   .banner.warn::before{background:var(--warn)}
  .banner.err{background:var(--danger-bg);border-color:rgba(255,123,114,.35);color:#FFD9D6} .banner.err::before{background:var(--danger)}
  .banner.info{background:var(--info-bg);border-color:rgba(124,184,255,.3);color:#D8E8FF}  .banner.info::before{background:var(--info)}
  .banner.desc{background:var(--surface-2);border-color:var(--line);color:var(--ink);white-space:pre-wrap} .banner.desc::before{background:var(--ink)}
  .banner b{color:inherit}
  .banner a{color:inherit}

  .codebox{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:4px;background:var(--bg-2);border:1.5px dashed rgba(255,255,255,.45);
    border-radius:14px;padding:16px;text-align:center;color:var(--ink);box-shadow:inset 0 0 40px rgba(255,255,255,.05)}

  /* ---- timeline / kv / tasks ---- */
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{position:relative;padding:0 0 16px 24px;border-left:1px solid var(--line-2);margin-left:6px}
  .timeline li:last-child{border-left-color:transparent}
  .timeline li::before{content:"";position:absolute;left:-5px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--ink);
    box-shadow:0 0 0 3px var(--surface),0 0 10px rgba(255,255,255,.35)}
  .timeline .t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .timeline .e{font-weight:500;font-size:14px;color:var(--ink-2)}
  .kv{display:flex;gap:8px;font-size:14px;padding:6px 0;align-items:flex-start;flex-wrap:wrap}
  .kv .k{color:var(--muted);width:120px;flex-shrink:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:3px;font-weight:600}
  .task{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:14px;background:var(--surface-2);flex-wrap:wrap}
  .task .due{margin-left:auto;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}

  .divider{height:1px;background:var(--line);margin:20px 0}
  .rule{height:1px;background:var(--line);margin:18px 0 2px}
  .back{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:10px;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.08em;transition:color var(--t) var(--ease),transform var(--t) var(--ease)}
  .back:hover{color:var(--ink);transform:translateX(-2px)}

  /* ---- stat tiles ---- */
  .stat{flex:1;min-width:150px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden;
    transition:border-color var(--t) var(--ease),transform var(--t) var(--ease)}
  .stat::after{content:"";position:absolute;right:-30px;bottom:-50px;width:130px;height:130px;border-radius:50%;pointer-events:none;
     background:radial-gradient(closest-side,rgba(255,255,255,.08),transparent)}
  .stat:hover{border-color:rgba(255,255,255,.3);transform:translateY(-1px)}
  .stat .n{font-family:var(--font-display);font-size:30px;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1.15}
  .stat .l{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
  .stat-button{appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .stat-button.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink),var(--shadow-1);transform:translateY(-1px)}
  .stat-button.active::before{content:"✓";position:absolute;top:10px;right:12px;z-index:1;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--surface);font-size:11px;font-weight:900}
  .stat-hint{position:relative;z-index:1;margin-top:9px;font-size:10.5px;color:var(--muted);font-weight:650}

  /* ---- messages ---- */
  .msgwrap{display:flex;flex-direction:column;gap:6px}
  .msg{padding:10px 14px;border-radius:14px;font-size:14px;max-width:78%;line-height:1.5;word-break:break-word;overflow-wrap:anywhere}
  .msg.reporter{background:var(--surface-2);color:var(--ink);align-self:flex-start;border:1px solid var(--line);border-bottom-left-radius:6px}
  .msg.handler{background:linear-gradient(135deg,#FFFFFF,#CFCFCF);color:var(--on-green);margin-left:auto;border-bottom-right-radius:6px;
    box-shadow:0 8px 20px -10px rgba(255,255,255,.35)}
  .msg.email{background:var(--surface-2);color:var(--ink);align-self:flex-start;border:1px dashed var(--line-2);border-bottom-left-radius:6px}
  .msg .who{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
  .msg.handler .who{color:var(--on-green)}
  .msg a{color:inherit;text-decoration:underline;text-underline-offset:2px}

  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  .subj-result{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer;font-size:13.5px;background:var(--surface-2);
    transition:border-color var(--t) var(--ease),background var(--t) var(--ease),transform var(--t) var(--ease)}
  .subj-result:hover{border-color:rgba(255,255,255,.45);background:var(--surface-3);transform:translateX(2px)}

  /* ---- dashboard ---- */
  .dash-actions{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .dash-actions select{width:auto;flex:1 1 150px}   /* WC / Legal filter selects share one bar instead of stacking full-width */
  .dash-toggle{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line-2);border-radius:var(--r-pill);background:var(--bg-2);max-width:100%}
  .dash-toggle button{border:0;background:transparent;color:var(--muted);padding:7px 16px;border-radius:var(--r-pill);font:inherit;font-size:12px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:color var(--t) var(--ease),background var(--t) var(--ease),box-shadow var(--t) var(--ease)}
  .dash-toggle button:hover{color:var(--ink)}
  .dash-toggle button.on{background:linear-gradient(135deg,#FFFFFF,#CFCFCF);color:var(--on-green);box-shadow:0 4px 14px -6px rgba(255,255,255,.4)}
  .transition-current{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
  .transition-current .mini-l{margin:0}
  .filters{margin-top:0;padding:0 16px;max-height:0;opacity:0;overflow:hidden;visibility:hidden;pointer-events:none;transform:translateY(-5px);border:1px solid transparent;border-radius:14px;background:var(--bg-2);transition:max-height 260ms var(--ease),opacity var(--t) var(--ease),transform var(--t) var(--ease),margin var(--t) var(--ease),padding var(--t) var(--ease),border-color var(--t) var(--ease)}
  .filters.is-open{margin-top:14px;padding:16px;max-height:760px;opacity:1;visibility:visible;pointer-events:auto;transform:none;border-color:var(--line)}
  .filter-panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
  .filter-panel-head b{font-size:14px}
  .filter-panel-head .note-sm{margin-top:2px}
  .filter-grid{display:grid;grid-template-columns:repeat(4,minmax(135px,1fr));gap:11px}
  .filter-field{min-width:0}
  .filter-field>span{display:block;margin:0 0 5px;font-size:10.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .filter-field input,.filter-field select{width:100%;min-width:0}
  .filter-search{grid-column:span 2}
  .empty-row{padding:20px!important;text-align:center;color:var(--grey)}
  .active-filter-list{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:12px}
  .active-filter-list:empty{display:none}
  .active-filter-label{font-size:10.5px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-right:1px}
  .filter-chip{appearance:none;display:inline-flex;align-items:center;gap:7px;max-width:100%;padding:6px 9px;border:1px solid var(--line-2);border-radius:999px;background:var(--surface-2);color:var(--ink-2);font:inherit;font-size:11.5px;font-weight:650;cursor:pointer}
  .filter-chip:hover{border-color:var(--ink);background:var(--surface-3)}
  .filter-chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .filter-chip>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filter-chip-x{font-size:15px;line-height:1;color:var(--muted)}
  .hrnote{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:8px;font-size:14px;white-space:pre-wrap;color:var(--ink-2)}
  .hrnote .t{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
  #manualbox .card{box-shadow:var(--glow)}

  /* ---- case detail panels ---- */
  .alleg-wrap{border:1px solid var(--line);border-radius:14px;background:var(--surface-2);padding:14px 16px;margin-top:6px}
  .alleg-row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .alleg-row:last-of-type{border-bottom:none}
  .alleg-row b{flex:1;min-width:160px}
  .iv-row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;background:var(--surface-2);display:flex;flex-direction:column}
  .iv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .iv-grid input,.iv-grid select{width:100%}
  .reassign{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;padding:12px;border:1px solid rgba(255,255,255,.25);border-radius:12px;background:var(--surface-2)}
  .reassign select{width:auto;min-width:150px} .reassign input{width:auto;flex:1;min-width:160px}
  .party-editor{margin:8px 0 12px;padding:14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2)}
  .party-editor select,.party-editor input{width:100%}
  .guide{border:1px solid rgba(255,255,255,.22);border-radius:14px;background:var(--surface-2);padding:16px 18px;margin-top:12px;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
  .guide .g-sec{margin-bottom:14px}
  .guide .g-sec:last-child{margin-bottom:0}
  .guide .mini-l{margin-bottom:5px}
  .guide ul{margin:4px 0 0;padding-left:18px}
  .guide li{margin-bottom:4px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:0 16px}
  .role-multi{border:1px solid var(--line-2);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:5px}
  .role-opt{display:flex;align-items:center;gap:8px;font-weight:400;font-size:13px;text-transform:none;letter-spacing:0;margin:0;color:var(--ink-2);cursor:pointer}
  .role-opt input[type=checkbox]{margin:0;width:15px;height:15px}

  /* ---- modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(5,9,7,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:50;padding:16px;animation:fade var(--t) var(--ease)}
  .modal{background:var(--surface);border-radius:var(--r-xl);border:1px solid var(--line-2);padding:26px;max-width:540px;width:100%;box-shadow:var(--shadow-2);
    animation:pop 220ms var(--ease);max-height:calc(100vh - 32px);overflow:auto}
  @keyframes fade{from{opacity:0}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}

  /* ---- responsive ---- */
  @media (max-width:640px){
    /* two rows: [earthbar | beaming]  /  [PEOPLE SUPPORT PORTAL ........ name · Sign out] */
    header.top{padding:12px 16px;gap:10px 12px;flex-wrap:wrap}
    header.top .brand{font-size:19px}
    header.top .brand.bm + .rule{display:none}   /* keep the divider between the two brands, drop the trailing one */
    header.top .sub{order:3;flex:1 0 50%;font-size:10px}
    html{scroll-padding-top:108px}
    /* Four handler tabs become a clear 2×2 grid; standard users keep a single two-tab row. */
    nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:6px 12px;overflow:visible;-webkit-mask-image:none;mask-image:none}
    nav::after{content:none}
    #userbox{order:4;margin-left:auto}
    #userbox .ub-title{display:none}
    #userbox .ub-name{max-width:52vw}   /* an unbreakable email (handler not in the directory) wraps instead of forcing a 3rd row */
    main{padding:18px 12px 56px}
    .card{padding:18px 16px;border-radius:14px}
    h2.section{font-size:18px}
    .stat{min-width:calc(50% - 9px)}
    .kv .k{width:100px}
    .msg{max-width:92%}
    table{font-size:13px} td,th{padding:10px 8px}
    .card:has(>table){padding-bottom:38px}
    .card:has(>table)::after{content:"Swipe → for more columns";position:absolute;right:16px;bottom:10px;color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
    .mini-l,.hrnote .t,.timeline .t{font-size:11.5px;color:var(--ink-2)}
    .note-sm{font-size:13px}
    .timeline .e{font-size:14.5px}
    /* thumb-sized targets (>=40px) for everything small */
    .btn.sm{padding:11px 14px}
    .dash-toggle button{padding:11px 16px}
    nav button{padding:10px 7px;min-height:40px;white-space:normal;line-height:1.2;text-align:center}
    .role-opt{padding:6px 0}
    .role-opt input[type=checkbox]{width:18px;height:18px}
    .filters.is-open{max-height:1800px}
    .filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .filter-search{grid-column:1/-1}
  }
  @media (max-width:420px){
    .btn{padding:10px 16px}
    .dash-toggle{flex-wrap:wrap;border-radius:14px}
    .dash-toggle button{flex:1 1 45%}
    .radio-card{min-width:100%}
    .filter-grid{grid-template-columns:1fr}
    .filter-search{grid-column:auto}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
    .spin{animation-duration:1.4s!important;animation-iteration-count:infinite!important}
    .btn:hover,.radio-card:hover,.back:hover,.subj-result:hover,.stat:hover{transform:none}
  }

  /* ---- Earthbar light-led revision ---------------------------------------------------------
     Earthbar's public brand is white-led with black as the high-contrast accent. Keep the
     operational status colors, but move their fills/text to light accessible tints. */
  :root{
    --eb-forest:#111111; --eb-green:#111111; --eb-green-2:#111111; --eb-mint:#FFFFFF;
    --bg:#F8F8F6; --bg-2:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F2; --surface-3:#ECECE8;
    --line:rgba(17,17,17,.10); --line-2:rgba(17,17,17,.18);
    --ink:#111111; --ink-2:#2D2D2D; --muted:#666666; --muted-2:#767676; --on-green:#FFFFFF;
    --ok:#17663A; --warn:#8A4B08; --danger:#A32925; --info:#17558C; --teal:#0B5E59;
    --ok-bg:#E8F5EC; --warn-bg:#FFF3DF; --danger-bg:#FDEBE9; --info-bg:#E8F2FC; --teal-bg:#E5F5F2; --neutral-bg:#F0F0ED;
    --green:#111111; --green-dk:#111111; --grey:#666666; --red:var(--danger);
    --wash:var(--surface-2); --wash2:var(--surface-3);
    --shadow-1:0 1px 2px rgba(17,17,17,.06),0 10px 28px -14px rgba(17,17,17,.16);
    --shadow-2:0 2px 6px rgba(17,17,17,.08),0 24px 56px -22px rgba(17,17,17,.20);
    --glow:0 0 0 1px rgba(17,17,17,.22),0 10px 30px -10px rgba(17,17,17,.14);
    --focus:0 0 0 3px rgba(17,17,17,.20);
  }
  html{background:var(--bg)}
  body::before{background:
    radial-gradient(900px 520px at 6% -12%,rgba(27,58,30,.045),transparent 62%),
    radial-gradient(720px 420px at 102% -4%,rgba(17,17,17,.035),transparent 60%),
    radial-gradient(900px 640px at 50% 112%,rgba(27,58,30,.025),transparent 62%)}
  ::selection{background:rgba(17,17,17,.14)}
  ::-webkit-scrollbar-thumb{background:rgba(17,17,17,.18)}
  header.top{background:rgba(255,255,255,.94);border-bottom-color:var(--line)}
  header.top::after{background:linear-gradient(90deg,transparent,rgba(17,17,17,.55) 35%,rgba(17,17,17,.16) 65%,transparent)}
  header.top .brand.eb{color:#111111}
  header.top .brand.bm{color:#3D3D3D}
  nav{background:rgba(255,255,255,.90);border-bottom-color:var(--line)}
  nav button:hover{color:var(--ink);background:rgba(17,17,17,.05)}
  nav button.active::after{background:linear-gradient(90deg,#111111,#666666);box-shadow:none}
  .card{box-shadow:var(--shadow-1),inset 0 1px 0 rgba(255,255,255,.85)}
  input:hover,textarea:hover,select:hover{border-color:rgba(17,17,17,.30)}
  input:focus,textarea:focus,select:focus{background-color:#FFFFFF}
  .radio-card:hover{border-color:rgba(17,17,17,.36)}
  .radio-card.sel{background:var(--surface-3);box-shadow:var(--glow)}
  .btn{color:#FFFFFF;background:#111111;background-image:none;box-shadow:0 6px 18px -8px rgba(17,17,17,.40)}
  .btn:hover{background:#000000;background-position:0 0;filter:none;box-shadow:0 12px 28px -8px rgba(17,17,17,.42)}
  .btn:active{filter:brightness(.90);box-shadow:0 2px 8px -4px rgba(17,17,17,.38)}
  .btn .spin{border-color:rgba(255,255,255,.30);border-top-color:#FFFFFF}
  .btn.sec{background:#FFFFFF;color:#111111;border-color:#111111}
  .btn.sec:hover{background:#F2F2EF;border-color:#111111;box-shadow:0 8px 22px -10px rgba(17,17,17,.24)}
  .btn.sec .spin{border-color:rgba(17,17,17,.22);border-top-color:#111111}
  .btn.ghost{color:#2D2D2D;border-color:rgba(17,17,17,.24)}
  .btn.ghost:hover{background:rgba(17,17,17,.05);color:#111111;border-color:rgba(17,17,17,.38)}
  .btn.danger{background:linear-gradient(135deg,#C9413B,#A32925);color:#FFFFFF}
  .btn.danger:hover{box-shadow:0 12px 28px -8px rgba(163,41,37,.42)}
  .pill{border-color:var(--line-2);color:var(--ink-2)}
  .pill.due-over{background:#F5A54E;color:#241A05;box-shadow:0 4px 12px -6px rgba(138,75,8,.45)}
  tr.clk:hover td{background:#F3F3F0}
  tr.clk:hover td:first-child{box-shadow:inset 3px 0 0 #111111}
  tr.overdue td{background:rgba(245,165,78,.13)}
  tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  tr.clk.overdue:hover td{background:rgba(245,165,78,.20)}
  .banner.ok{color:#155C35}.banner.warn{color:#744006}.banner.err{color:#8D211D}.banner.info{color:#124773}
  .codebox{background:#FFFFFF;border-color:rgba(17,17,17,.34);color:#111111;box-shadow:inset 0 0 40px rgba(17,17,17,.035)}
  .timeline li::before{box-shadow:0 0 0 3px var(--surface),0 0 10px rgba(17,17,17,.18)}
  .stat::after{background:radial-gradient(closest-side,rgba(17,17,17,.045),transparent)}
  .stat-button.active{background:#F5F5F2;border-color:#111111;box-shadow:0 0 0 2px #111111,0 12px 28px -18px rgba(17,17,17,.5)}
  .stat-button.active::before{background:#111111;color:#FFFFFF}
  .msg.handler{background:#111111;color:#FFFFFF;box-shadow:0 8px 20px -10px rgba(17,17,17,.42)}
  .msg.handler .who{color:rgba(255,255,255,.72)}
  .subj-result:hover{border-color:rgba(17,17,17,.38);background:#F3F3F0}
  .dash-toggle{background:#FFFFFF}
  .dash-toggle button.on{background:#111111;color:#FFFFFF;box-shadow:0 4px 14px -6px rgba(17,17,17,.42)}
  .filters{background:#FFFFFF}
  .modal{background:var(--surface);border-color:var(--line-2)}
  /* Light-theme accessibility polish: visible control boundaries and a non-overlapping mobile cue. */
  input[type=text],input[type=date],input[type=number],textarea,select{border-color:rgba(17,17,17,.45)}
  input:hover,textarea:hover,select:hover{border-color:#111111}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23666666' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>")}
  @media (max-width:640px){
    .card:has(>table){padding-bottom:18px}
    .card:has(>table)::after{position:static;display:block;margin-top:10px;text-align:right;white-space:nowrap}
  }
</style>
</head>

<header class="top">
  <!-- 8/18 call: app renamed to People Support Portal (PSP); Beaming shown alongside Earthbar -->
  <div class="brand eb">earthbar</div>

  <div class="rule"></div>
