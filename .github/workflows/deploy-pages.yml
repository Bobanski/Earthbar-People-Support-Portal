name: Validate and deploy portal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate deployment boundary
        shell: bash
        run: |
          test "$(find site -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(find site -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 0
          ! grep -R -E -i 'SUPABASE_SERVICE_ROLE|SERVICE_ROLE_KEY|BEGIN (RSA |EC )?PRIVATE KEY|\.sharepoint\.com/' site
      - name: JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/config.js
          node --check site/minizip.js
          node --check site/store_org.js
          node --check site/store_locations.js

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
