name: Validate and deploy portal

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          core_paths="$(printf '%s\n' \
            .github/workflows/deploy-pages.yml \
            README.md \
            SOURCE_RELEASE.md \
            site/app.js \
            site/config.js \
            site/index.html \
            site/minizip.js \
            site/store_locations.js \
            site/store_org.js)"
          allowed_paths="$(printf '%s\n' "$core_paths" site/statement_template.js | LC_ALL=C sort)"
          expected_paths="$core_paths"
          files=(app.js config.js index.html minizip.js store_locations.js store_org.js)
          if test -f site/statement_template.js; then
            expected_paths="$allowed_paths"
            files+=(statement_template.js)
          fi
          actual_paths="$(find . -path './.git' -prune -o -type f -printf '%P\n' | LC_ALL=C sort)"
          history_paths="$(git log --all --pretty=format: --name-only | sed '/^$/d' | LC_ALL=C sort -u)"
          test "$actual_paths" = "$expected_paths"
          test -z "$(comm -23 <(printf '%s\n' "$history_paths") <(printf '%s\n' "$allowed_paths"))"
          test -z "$(find . -path './.git' -prune -o -type l -print -quit)"
          if grep -q 'statement_template[.]js' site/app.js; then
            test -f site/statement_template.js
          fi

          grep -Eq '^- Private source commit: `[0-9a-f]{40}` \(PR #[1-9][0-9]*\)$' SOURCE_RELEASE.md
          test "$(grep -Ec '^\| `site/[^`]+` \| `[0-9a-f]{64}` \|$' SOURCE_RELEASE.md)" -eq "${#files[@]}"
          for file in "${files[@]}"; do
            expected="$(awk -F'`' -v path="site/$file" '$2 == path { print $4 }' SOURCE_RELEASE.md)"
            actual="$(sha256sum "site/$file" | cut -d' ' -f1)"
            test "${#expected}" -eq 64
            test "$actual" = "$expected"
          done

          sensitive='SUPABASE[_]SERVICE[_]ROLE|SERVICE[_]ROLE[_]KEY|BEGIN (RSA |EC )?PRIVATE KEY|[.]sharepoint[.]com/'
          ! grep -R -E -i "$sensitive" . --exclude-dir=.git
          history_baseline='79d909cacc373cf8d04e6d84b3a51b8adc4a8ede'
          git merge-base --is-ancestor "$history_baseline" HEAD
          while read -r object path; do
            test -n "${path:-}" || continue
            if test "$(git cat-file -t "$object")" = blob && git cat-file blob "$object" | grep -Eiq "$sensitive"; then
              echo "Sensitive value found in public history path: $path" >&2
              exit 1
            fi
          done < <(git rev-list --objects --all --not "$history_baseline")
      - name: JavaScript syntax
        run: |
          node --check site/app.js
          node --check site/config.js
          node --check site/minizip.js
          node --check site/store_org.js
          node --check site/store_locations.js
          if test -f site/statement_template.js; then node --check site/statement_template.js; fi

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
